<!DOCTYPE html>
<html>

<head>
    <title>Math Problems</title>

    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f0f0f0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .problem {
            width: 30%;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            
            /* စာသားလျှံထွက်မှုကို ထိန်းချုပ်ရန် */
            overflow-x: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        h3, h4 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h2>Math Problems</h2>

    <div class="container">
        {% for p in problems %}
        <div class="problem">
            <h3>Question</h3>
            <div>{{ p.question | safe }}</div>

            <h4>Solution</h4>
            <div>{{ p.steps | safe }}</div>

            <h4>Answer</h4>
            <div>{{ p.answer | safe }}</div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
