<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Formula - Math Solver</title>

    <!-- Safe MathJax CDN Config -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.min.js"></script>

    <!-- MathLive Virtual Keyboard CDN -->
    <script defer src="https://unpkg.com/mathlive"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0714;
            color: #e9d5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #130c25;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #2d1a4d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #f3e8ff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            background: #180d30;
            border: 1px solid #2d1a4d;
            border-radius: 12px;
            color: #f3e8ff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            background: #1c1236;
        }

        /* MathLive Virtual Keyboard Styles */
        math-field {
            background-color: #180d30 !important;
            color: #f3e8ff !important;
            border: 1px solid #2d1a4d !important;
            border-radius: 12px !important;
            font-size: 14px !important;
            padding: 8px 12px !important;
            width: 100% !important;
            outline: none !important;
            transition: all 0.2s ease !important;
        }

        math-field:focus-within {
            border-color: #a855f7 !important;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3) !important;
            background-color: #1c1236 !important;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            background: #9333ea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.3);
        }

        button:hover {
            background: #a855f7;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: #1c1236;
            border: 1px solid #3b1f6e;
            box-shadow: none;
        }

        .cancel-btn a {
            text-decoration: none;
            color: #c084fc;
            display: block;
            width: 100%;
            height: 100%;
            font-weight: 700;
        }

        .cancel-btn:hover {
            background: #2e185b;
            box-shadow: none;
        }

        .cancel-btn:hover a {
            color: #ffffff;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #180d30;
            border: 1px solid #2d1a4d;
            border-radius: 12px;
            color: #f3e8ff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            background: #1c1236;
        }


    </style>
</head>
<body>

<div class="container">
    <h2>📐 Add Formula</h2>

    <form action="/add_formula" method="POST" onsubmit="syncMathInput()">
        <label>Category</label>
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}">{{ c.category_name }}</option>
            {% endfor %}
        </select>

        <label>Formula Name</label>
        <input type="text" name="formula_name" placeholder="e.g. Area of Circle" required>


        <label>Formula Text</label>
        <math-field id="math_formula_text" placeholder="e.g. A = \pi r^2"></math-field>
        <input type="hidden" id="formula_text" name="formula_text" required>

        <div class="btn-container">
            <button type="submit">Save Formula</button>
            <button type="button" class="cancel-btn"><a href="/admin">Cancel</a></button>
        </div>
    </form>
</div>

<script>
    function syncMathInput() {
        document.getElementById('formula_name').value = document.getElementById('math_formula_name').value;
        document.getElementById('formula_text').value = document.getElementById('math_formula_text').value;
    }
</script>

</body>
</html>
