<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Problem - Math Solver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0714;
            color: #e9d5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            background: #130c25;
            width: 100%;
            max-width: 600px;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #2d1a4d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #f3e8ff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #180d30;
            border: 1px solid #2d1a4d;
            border-radius: 12px;
            color: #f3e8ff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            line-height: 1.5;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            background: #1c1236;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            background: #9333ea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.3);
        }

        button:hover {
            background: #a855f7;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: #1c1236;
            border: 1px solid #3b1f6e;
            box-shadow: none;
        }

        .cancel-btn a {
            text-decoration: none;
            color: #c084fc;
            display: block;
            width: 100%;
            height: 100%;
            font-weight: 700;
        }

        .cancel-btn:hover {
            background: #2e185b;
            box-shadow: none;
        }

        .cancel-btn:hover a {
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Add Math Problem</h2>

    <form action="/add_problem" method="POST">
        <label>Category</label>
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}">{{ c.category_name }}</option>
            {% endfor %}
        </select>

        <label>Question</label>
        <textarea name="question_text" placeholder="Enter question" rows="4" required></textarea>

        <label>Solution Steps</label>
        <div id="steps">
            <textarea name="steps" rows="8" placeholder="Enter solution steps (One step per line)"></textarea>
        </div>

        <div class="btn-container">
            <button type="submit">Save Problem</button>
            <button type="button" class="cancel-btn"><a href="/admin">Cancel</a></button>
        </div>
    </form>
</div>

</body>
</html>
