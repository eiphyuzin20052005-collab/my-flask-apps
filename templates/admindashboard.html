<!DOCTYPE html>
<html>
<head>
    <title>Admin - All Users</title>
</head>

<body>

<h2>All Users</h2>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
     <th>Password</th>
    <th>Role</th>
</tr>

{% for user in users %}
<tr>
    <td>{{ user[0] }}</td>
    <td>{{ user[1] }}</td>
    <td>{{ user[2] }}</td>
     <td>{{ user[3]}}</td>
    <td>{{ user[4]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
