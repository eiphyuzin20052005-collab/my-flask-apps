<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0714;
            color: #e9d5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #130c25;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #2d1a4d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #f3e8ff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            background: #180d30;
            border: 1px solid #2d1a4d;
            border-radius: 12px;
            color: #f3e8ff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            background: #1c1236;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background: #9333ea;
            color: white;
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.3);
        }

        .btn-submit:hover {
            background: #a855f7;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #1c1236;
            color: #c084fc;
            border: 1px solid #3b1f6e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel:hover {
            background: #2e185b;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✏️ Edit Category</h2>
    
    <form method="POST">
        <div class="form-group">
            <label>Category Name</label>
            <input type="text" name="category_name" value="{{ category.category_name }}" required>
        </div>

        <div class="form-group">
            <label>Level</label>
            <select name="category_level" required>
                <option value="Basic" {% if category.level == 'Basic' %}selected{% endif %}>Basic</option>
                <option value="Intermediate" {% if category.level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
                <option value="Advanced" {% if category.level == 'Advanced' %}selected{% endif %}>Advanced</option>
            </select>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-submit">Update</button>
            <a href="/admin" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
