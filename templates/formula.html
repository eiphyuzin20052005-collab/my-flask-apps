<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Probability Formulas</title>

    <script async 
src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js">
</script>
       
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#0066cc;
            margin-bottom:30px;
        }

        .box{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .title{
            font-size:22px;
            font-weight:bold;
            color:#333;
        }

        .formula{
            margin-top:15px;
            font-size:24px;
            color:#000;
        }
    </style>
</head>
<body>

<h1>Probability Formulas</h1>

{% for formula in formulas %}
<div class="box">

    <div class="title">
        {{ formula[0] }}
    </div>

    <div class="formula">
        $$ {{ formula[1] | safe }} $$
    </div>

</div>
{% endfor %}

</body>
</html>
