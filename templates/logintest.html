<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Explorer - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Split Layout Container */
        .wrapper {
            display: flex;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 1050px;
            max-width: 100%;
            min-height: 650px;
            overflow: hidden;
        }

        /* Left Side: Math Solver Illustration */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid #e2e8f0;
        }

        .math-illustration {
            width: 85%;
            max-width: 320px;
            height: auto;
        }

        /* Right Side: Form Area */
        .right-panel {
            flex: 1.1;
            padding: 45px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-section h1 {
            font-size: 28px;
            color: #1a202c;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-section p {
            font-size: 13.5px;
            color: #718096;
            line-height: 1.5;
        }

        /* Form Controls */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .name-row {
            display: flex;
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            position: relative;
        }

        .form-field label {
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13.5px;
            background-color: #f8fafc;
            color: #1a202c;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-field input:focus {
            border-color: #f09365;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(240, 147, 101, 0.15);
        }

        /* Password input specific logic (eye icon) */
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
            font-size: 14px;
        }

        /* Create Account Button (Orange theme from reference image) */
        .submit-button {
            background-color: #d24e0c;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }

        .submit-button:hover {
            background-color: #9c3705;
        }
        /* Terms & Privacy text */
        .policy-text {
            font-size: 11.5px;
            color: #a0aec0;
            text-align: center;
            margin-top: -4px;
            line-height: 1.4;
        }

        .policy-text a {
            color: #718096;
            text-decoration: underline;
        }

        /* Social Divider */
        .divider {
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px 0;
            position: relative;
        }

        /* Social Sign In Links */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 5px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4a5568;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .social-link:hover {
            background-color: #f7fafc;
        }

        .social-link svg {
            width: 16px;
            height: 16px;
        }

        /* Footer Login Redirect */
        .login-redirect {
            text-align: center;
            font-size: 13px;
            color: #718096;
            margin-top: 20px;
        }

        .login-redirect a {
            color: #f09365;
            text-decoration: none;
            font-weight: 600;
        }

        /* Responsive Breakpoint */
        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
                width: 100%;
                border-radius: 16px;
            }
            .left-panel {
                padding: 30px 20px;
            }
            .math-illustration {
                max-width: 180px;
            }
            .right-panel {
                padding: 30px 20px;
            }
            .name-row {
                flex-direction: column;
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="left-panel">
            <svg class="math-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#e8f5e9" />
                <rect x="50" y="60" width="100" height="70" rx="6" fill="#2e7d32" />
                <rect x="55" y="65" width="90" height="60" rx="4" fill="#1a1a1a" />
                <path d="M65 85 L75 95 M75 85 L65 95" stroke="#ffffff" stroke-width="2" />
                <path d="M85 90 L95 90" stroke="#ffffff" stroke-width="2" />
                <path d="M110 85 Q115 75, 120 85 T130 85" fill="none" stroke="#66bb6a" stroke-width="2" />
                <text x="65" y="115" fill="#ffffff" font-family="monospace" font-size="12">f(x) = dy/dx</text>
                <circle cx="140" cy="140" r="25" fill="#f09365" />
                <path d="M130 150 L140 125 L150 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
                <path d="M133 145 L147 145" stroke="#ffffff" stroke-width="1.5" />
            </svg>
        </div>

        <div class="right-panel">
            <div class="header-section">
                <h1>Welcome Explorer!</h1>
            </div>

            <form class="signup-form" action="/register " method="POST">
                <div class="name-row">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" name="name" placeholder="Enter your name" required>
                    </div>
                    
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>


                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" name="password" placeholder="Enter your password" required>
                        <span class="toggle-password">👁</span>
                    </div>
                </div>

                <button type="submit" class="submit-button">Create Account</button>

                <p class="policy-text">
                    By continuing with Google, Apple, or Email, you agree to monkey <br>
                    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                </p>

                <div class="divider">or continue with</div>

                <div class="social-container">
                    <a href="https://accounts.google.com" target="_blank" class="social-link">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                        </svg>
                        Google
                    </a>
                    <a href="https://appleid.apple.com" target="_blank" class="social-link">
                        <svg viewBox="0 0 24 24" fill="#000000" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.58 2.95-1.39z"/>
                        </svg>
                        Apple
                    </a>
                </div>
            </form>

            <div class="login-redirect">
                Do have an account? <a href="#">Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
