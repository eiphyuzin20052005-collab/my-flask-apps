<!DOCTYPE html>

<html>

<head>

<title>Profile</title>


<style>


body{

    font-family:'Segoe UI',Arial;
    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    min-height:100vh;
    margin:0;

    display:flex;
    justify-content:center;
    align-items:center;

}




.profile-card{


    width:400px;

    background:white;

    border-radius:25px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.2);


}




.avatar{


    width:100px;

    height:100px;

    border-radius:50%;

    background:#667eea;

    color:white;

    font-size:45px;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

}




h1{

    color:#333;

}



.email{

    color:#777;

}





.info{


    margin-top:30px;

    text-align:left;


}



.box{


    background:#f5f7ff;

    padding:15px;

    margin:12px 0;

    border-radius:12px;


}



.label{

    color:#667eea;

    font-weight:bold;

}




.back{


    display:inline-block;

    margin-top:25px;

    padding:12px 30px;

    background:#667eea;

    color:white;

    text-decoration:none;

    border-radius:20px;


}



.back:hover{

    background:#4c5bd4;

}



</style>


</head>


<body>



<div class="profile-card">


<div class="avatar">

{{user.name[0]}}

</div>



<h1>
{{user.name}}
</h1>


<p class="email">
{{user.email}}
</p>




<div class="info">


<div class="box">

<span class="label">
Learning Level :
</span>

{{user.level}}

</div>



<div class="box">

<span class="label">
Solved Problems :
</span>

{{user.solved}}

</div>



<div class="box">

<span class="label">
Member Since :
</span>

{{user.joined}}

</div>


</div>




<a class="back" href="hm.html">
Back Home
</a>



</div>




</body>

</html>
